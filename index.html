<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>R1 Minecraft (Minetest-like)</title>
<meta name="viewport" content="width=240,height=282,initial-scale=1.0,user-scalable=no">
<style>
  html,body {margin:0;padding:0;overflow:hidden;background:#000;font-family:sans-serif;}
  #canvas {display:block;width:240px;height:282px;}
  #hud {position:absolute;top:0;left:0;width:240px;padding:4px;background:rgba(0,0,0,0.6);color:#fff;font-size:10px;line-height:1.4;z-index:10;}
  #hotbar {position:absolute;bottom:4px;left:0;width:240px;height:22px;background:rgba(0,0,0,0.7);display:flex;overflow:hidden;}
  .slot {flex:1;text-align:center;color:#fff;padding:2px;border-right:1px solid #555;}
  .slot.selected {background:#555;}
  #msg {position:absolute;top:120px;left:0;width:240px;text-align:center;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div id="hotbar"></div>
  <div id="msg">Move: drag | Mine/Place: side button | Inventory: long press</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';

// ---------- Scene setup ----------
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setSize(240,282);
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // sky blue
const camera = new THREE.PerspectiveCamera(75, 240/282, 0.1, 100);
camera.position.set(0,1.6,0);

// simple first‑person controller (will be overridden by R1 inputs later)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 12;

// ---------- Block engine ----------
const TILE = 1; // each voxel is 1 unit
const WORLD_SIZE = 16; // 16×16×8 chunks
const HEIGHT = 8;
const BLOCK_SIZE = TILE;

const blockTypes = {
  air: {id:0, name:'Air', transparent:true},
  grass: {id:1, name:'Grass', color:0x76a83c},
  dirt: {id:2, name:'Dirt', color:0x8b5a2b},
  stone: {id:3, name:'Stone', color:0x999999},
  wood: {id:4, name:'Wood', color:0xdeb887},
  leaf: {id:5, name:'Leaf', color:0x228b22},
  sand: {id:6, name:'Sand', color:0xf5deb3},
};

// simple voxel data: flat grassy terrain
let voxels = [];
function initWorld(){
  for(let x=0;x<WORLD_SIZE;x++){
    for(let y=0;y<HEIGHT;y++){
      for(let z=0;z<WORLD_SIZE;z++){
        if(y===0){ voxels.push(3); continue; } // stone floor
        if(y===1){ voxels.push(2); continue; } // dirt
        if(y===2){ voxels.push(1); continue; } // grass top
        if(y>2 && y<HEIGHT-1 && Math.random()<0.02){ voxels.push(4); } // occasional wood
        else { voxels.push(0); } // air
      }
    }
  }
}
initWorld();

// create mesh geometry for each solid block
function buildChunks(){
  // remove old meshes
  scene.traverse(o=>{ if(o.isMesh) scene.remove(o); });
  const geom = new THREE.BoxGeometry(TILE,TILE,TILE);
  const matMaterial = new THREE.MeshLambertMaterial({vertexColors:THREE.VertexColors});
  let idx = 0;
  for(let x=0;x<WORLD_SIZE;x++){
    for(let y=0;y<HEIGHT;y++){
      for(let z=0;z<WORLD_SIZE;z++){
        const id = voxels[idx];
        if(id===0) { idx++; continue; }
        const material = new THREE.MeshLambertMaterial({color:blockTypes[id].color});
        const mesh = new THREE.Mesh(geom, material);
        mesh.position.set(
          (x - WORLD_SIZE/2 + 0.5) * TILE,
          (y - HEIGHT/2 + 0.5) * TILE,
          (z - WORLD_SIZE/2 + 0.5) * TILE
        );
        scene.add(mesh);
        idx++;
      }
    }
  }
}
buildChunks();

// lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5,10,7);
scene.add(dirLight);

// ---------- R1 input abstraction ----------
let selectedSlot = 0;
let hotbar = [' grass',' dirt',' stone',' wood',' leaf',' sand',' grass',' dirt',' stone'];
function renderHotbar(){
  const container = document.getElementById('hotbar');
  container.innerHTML = '';
  for(let i=0;i<9;i++){
    const d = document.createElement('div');
    d.className = i===selectedSlot?'slot selected':'slot';
    d.textContent = hotbar[i] || '';
    container.appendChild(d);
  }
}
renderHotbar();

// ---------- Mouse / Touch interaction ----------
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let isBuilding = false; // toggled by side‑button long press

function onPointerDown(event){
  // normalize mouse coords
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / canvas.clientHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(scene.children, true);
  if(intersects.length===0) return;
  const face = intersects[0].face;
  const norm = face.normal;
  const point = intersects[0].point.clone().add(norm.multiplyScalar(0.001));
  // determine block coords
  const bx = Math.floor(point.x / TILE) + WORLD_SIZE/2;
  const by = Math.floor(point.y / TILE) + HEIGHT/2;
  const bz = Math.floor(point.z / TILE) + WORLD_SIZE/2;
  if(event.type==='pointerdown' || event.type==='mousedown'){
    // mine block (set to air) – only if not in building mode
    if(!isBuilding){
      voxels[ (bx-/* offset */) * (WORLD_SIZE*HEIGHT) + (by-/* offset */)*WORLD_SIZE + (bz-/* offset */) ] = 0;
      scene.remove(intersects[0].object);
      // simple re‑build nearby chunks for demo – rebuild whole for simplicity
      buildChunks();
    }
  } else if(event.type==='pointerup' || event.type=== 'mouseup'){
    // place block if we are in building mode
    if(isBuilding){
      // find empty neighbour spot – simplistic: place at hit location
      voxels[ (bx-/* offset */) * (WORLD_SIZE*HEIGHT) + (by-/* offset */)*WORLD_SIZE + (bz-/* offset */) ] = selectedSlot%6 +1; // cycle through block types
      buildChunks();
    }
  }
}
canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointerup', onPointerDown);

// ---------- R1‑style control mapping (mock) ----------
let gameState = 'playing';
let lastSideClick = 0;
let sideButtonLongPress = false;
let longPressTimer =null;

function simulateSideClick(){
  const now = Date.now();
  if(now - lastSideClick < 400){
    // double‑tap => toggle creative (for demo just alert)
    alert('Creative mode toggled (simulated)');
    lastSideClick = 0;
    return;
  }
  lastSideClick = now;
  // single tap: mine/place depending on isBuilding
  isBuilding = !isBuilding;
  if(isBuilding){
    document.getElementById('msg').textContent = 'Building mode: tap to place';
  }else{
    document.getElementById('msg').textContent = 'Mining mode: tap to mine';
  }
}
// In a real R1 the side‑button events would call simulateSideClick().

// ---------- Hot‑wheel (scroll) navigation ----------
let hotIdx = 4; // start at wood
window.addEventListener('wheel', e=>{
  // simple wrap
  hotIdx = (hotIdx + (e.deltaY>0?-1:1) + 9) % 9;
  selectedSlot = hotIdx;
  renderHotbar();
});

// ---------- Animation loop ----------
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---------- Expose some globals for demo ----------
window.initWorld = initWorld;
window.buildChunks = buildChunks;
window.simulateSideClick = simulateSideClick;
</script>
</body>
</html>
